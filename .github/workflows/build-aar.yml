name: Build media3ext AAR (Xvid/DivX/WMV)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Тег/ветка NextLib для сборки (v0.8.4 = media3 1.5.1)"
        default: "v0.8.4"
        required: true
      release_tag:
        description: "Если задать — создаст GitHub Release с этим тегом и приложит .aar"
        default: ""
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout NextLib source at ref
        uses: actions/checkout@v4
        with:
          repository: anilbeesetti/nextlib
          ref: ${{ github.event.inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config make

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 25.2.9519653 + CMake 3.22.1 + platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Patch enabled FFmpeg decoders + ARM-only ABIs
        run: |
          set -euxo pipefail
          sed -i 's|^ENABLED_DECODERS=.*|ENABLED_DECODERS="vorbis opus flac alac pcm_mulaw pcm_alaw mp3 amrnb amrwb aac ac3 eac3 dca mlp truehd wmav1 wmav2 wmapro h264 hevc mpeg2video mpegvideo mpeg4 msmpeg4v1 msmpeg4v2 msmpeg4v3 h263 h263p h263i vc1 wmv1 wmv2 wmv3 flv1 vp6 vp6a vp6f svq1 svq3 cinepak rv10 rv20 rv30 rv40 libvpx_vp8 libvpx_vp9"|' ffmpeg/setup.sh
          sed -i 's|^ANDROID_ABIS=.*|ANDROID_ABIS="armeabi-v7a arm64-v8a"|' ffmpeg/setup.sh
          sed -i 's|abiFilters += listOf("x86", "x86_64", "armeabi-v7a", "arm64-v8a")|abiFilters += listOf("armeabi-v7a", "arm64-v8a")|' media3ext/build.gradle.kts

      - name: Patch MIME to decoder whitelist (add mp4v/h263/vc1)
        run: |
          set -euxo pipefail
          f=media3ext/src/main/java/io/github/anilbeesetti/nextlib/media3ext/ffdecoder/FfmpegLibrary.java
          perl -0777 -i -pe 's/(case MimeTypes\.VIDEO_H264 -> "h264";)/$1\n      case MimeTypes.VIDEO_MP4V -> "mpeg4";\n      case MimeTypes.VIDEO_H263 -> "h263";\n      case MimeTypes.VIDEO_VC1 -> "vc1";/' "$f"
          grep -n 'VIDEO_' "$f"

      - name: Build media3ext release AAR
        run: ./gradlew :media3ext:assembleRelease --no-daemon --stacktrace

      - name: Rename AAR
        run: |
          set -eux
          mkdir -p out
          cp media3ext/build/outputs/aar/media3ext-release.aar out/nextlib-media3ext-xvid.aar

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextlib-media3ext-xvid-aar
          path: out/nextlib-media3ext-xvid.aar
          if-no-files-found: error

      - name: Create GitHub Release (optional)
        if: ${{ github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: out/nextlib-media3ext-xvid.aar
